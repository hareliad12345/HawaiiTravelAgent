const CANOE=new Set(['banana','mountainapple','ulu','coconut']);
const list=document.getElementById('list');
list.innerHTML=F.map(f=>`<article class="fruit" data-s="${f.s}" data-k="${f.k}">
 <div class="plate">${ART[f.k]}</div>
 <div class="body">
  <div class="name"><h2>${f.he}</h2><span>${f.en}</span></div>
  <div class="tags"><span class="tag ${f.s}">${f.st}</span><span class="tag">🌱 ${f.grow}</span><span class="tag">📅 ${f.season}</span></div>
  <p><b>טעם:</b> ${f.taste}</p>
  <p><b>מה מיוחד:</b> ${f.fact}</p>
 </div></article>`).join('');
const btns=[...document.querySelectorAll('.filters button')];
function apply(v){btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===v)));
 document.querySelectorAll('.fruit').forEach(el=>{el.hidden=v==='now'?el.dataset.s!=='now':v==='canoe'?!CANOE.has(el.dataset.k):false});
 try{localStorage.setItem('fruitFilter',v)}catch(e){}}
btns.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.f)));
try{const v=localStorage.getItem('fruitFilter');if(v)apply(v)}catch(e){}
